<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>동의서 서명받기</title>
<!-- 이 파일은 예전 주소(…github.io/sign/)로 들어온 분을 서명 화면(public/index.html)으로 넘겨 주기만 합니다.
     주소 뒤에 붙은 내용(?s=…&p=…)은 그대로 가져갑니다. 프로그램 본체는 public/index.html 입니다. -->
<script>location.replace('public/index.html' + location.search + location.hash);</script>
</head>
<body>
<noscript><p><a href="public/index.html">서명 화면 열기</a></p></noscript>
</body>
