<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>동의서 서명받기(배포용)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 서명자 화면은 가운데 한 단(휴대폰 우선) — 안내문 → 본인 확인 → 서명 패드 → 서식 확인.
   관리자 화면은 탭 + 넓은 작업면. 동의서 서식은 어느 테마에서도 흰 종이에 먹색. 인주색은 '서명'에만 쓴다. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#18212B; --muted:#5B6875; --line:#D2D9E0; --line2:#B3BEC9;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --accent-soft:#DCE7F2;
  --seal:#C4372B; --seal-soft:#F8E3E0;
  --ok:#2A7350; --ok-soft:#DCEFE5; --warn:#8F5D0E; --warn-soft:#F6EAD0; --bad:#B3362A; --bad-soft:#F7DFDB;
  --scrim:rgba(14,22,30,.55); --shadow:0 1px 2px rgba(24,33,43,.06),0 10px 28px rgba(24,33,43,.10);
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-doc:'Gowun Batang','Nanum Myeongjo','함초롬바탕','Batang','바탕',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --sunk:#212C37; --ink:#E4EAF0; --muted:#9AA8B5; --line:#2C3945; --line2:#40505F;
  --accent:#7FB2E0; --accent-ink:#0B1722; --accent-soft:#1B3349;
  --seal:#EF7A6C; --seal-soft:#3C1F1B;
  --ok:#6CC596; --ok-soft:#173326; --warn:#E3B160; --warn-soft:#3A2D14; --bad:#F08377; --bad-soft:#3D1E1A;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --sunk:#212C37; --ink:#E4EAF0; --muted:#9AA8B5; --line:#2C3945; --line2:#40505F;
  --accent:#7FB2E0; --accent-ink:#0B1722; --accent-soft:#1B3349;
  --seal:#EF7A6C; --seal-soft:#3C1F1B;
  --ok:#6CC596; --ok-soft:#173326; --warn:#E3B160; --warn-soft:#3A2D14; --bad:#F08377; --bad-soft:#3D1E1A;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.55}

/* 머리줄 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.mk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font:700 13px/1 var(--f-doc);letter-spacing:-.02em;transform:rotate(-8deg)}
.brand b{display:block;font-size:16px;line-height:1.25}
.prog{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.pname{font:700 16px/1.25 var(--f-ui);white-space:nowrap}
.doctitle{display:block;font:800 19px/1.25 var(--f-ui);color:var(--ink);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(60vw,560px)}
@media (max-width:600px){.prog{gap:8px}.prog .brand-div{display:none}.doctitle{font-size:16px;max-width:100%}}
.brand small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.bar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.factory{display:flex;align-items:center;gap:9px;flex:none}
.factory svg{width:32px;height:32px;flex:none;display:block}
.wm{display:flex;flex-direction:column;line-height:1.15}
.wm-1{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.wm-2{font:700 18px/1.15 var(--f-ui);letter-spacing:-.015em;color:var(--ink)}
.mkcredit{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:10px;border-left:1px solid var(--line);font:700 12px/1.45 var(--f-ui);color:var(--ink);white-space:nowrap}
.brand-div{width:1px;height:40px;background:var(--line);flex:none}
@media (max-width:600px){.mkcredit,.brand-div{display:none}}
.foot b{color:var(--ink);font-weight:700}
.notice figure{margin:0}.notice figure img{display:inline-block;border-radius:8px;border:1px solid var(--line);height:auto}
.notice figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.filechip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line2);border-radius:9px;font:500 13.5px/1.3 var(--f-ui);background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
.ext{font:600 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase;flex:none}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;background:var(--bg);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px}
.mrow .th{width:76px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:var(--sunk)}
.mrow .ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px}
.mrow .ctl input[type=range]{width:110px}
.mrow .ctl .in{min-height:32px;padding:4px 8px;font-size:13px}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.ed{font:600 11px/1 var(--f-ui);border:1px solid currentColor;border-radius:999px;padding:3px 7px;color:var(--muted);white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.narrow{max-width:754px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.foot{max-width:1180px;margin:0 auto;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}

/* 단추·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 14px/1.2 var(--f-ui);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.big{min-height:54px;font-size:17px;border-radius:12px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.sp{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:400 16px/1.45 var(--f-ui);min-width:0}
textarea.in{resize:vertical;min-height:90px}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in[readonly]{background:var(--sunk)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;cursor:pointer;font-weight:500;color:var(--ink)}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font:600 12px/1 var(--f-ui);white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13.5px;line-height:1.6;background:var(--sunk);border-radius:10px;padding:10px 13px;color:var(--ink)}
.note.warn{background:var(--warn-soft)} .note.warn b{color:var(--warn)}
.note.ok{background:var(--ok-soft)} .note.ok b{color:var(--ok)}
.note.bad{background:var(--bad-soft)} .note.bad b{color:var(--bad)}

/* 서명자: 단계 */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps li.on{color:var(--accent)} .steps li.on::before{background:var(--accent)}
.steps li.done::before{background:var(--accent)}
.guide{font-size:13.5px;color:var(--muted);line-height:1.6}
.notice{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.notice h2{font:700 20px/1.35 var(--f-doc)}
.nbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.75}
.notice img{display:block;border-radius:8px;border:1px solid var(--line);height:auto}
.target{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.target b{color:var(--ink);font-family:var(--f-doc)}
.pin{font:600 30px/1 var(--f-mono);letter-spacing:.35em;text-align:center;padding:12px 0 12px .35em;min-height:60px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.who b{font:700 22px/1.2 var(--f-doc)}
.picks{display:flex;flex-direction:column;gap:6px}
.picks label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;cursor:pointer;font-weight:600}
.picks input{width:20px;height:20px;accent-color:var(--accent)}

/* 서명 패드: 언제나 흰 종이 */
.padbox{position:relative;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;touch-action:none}
.padbox canvas{display:block;width:100%;aspect-ratio:5/2;touch-action:none;cursor:crosshair}
.padbox::after{content:"";position:absolute;left:6%;right:6%;bottom:22%;border-bottom:1px dashed #c6ccd3;pointer-events:none}
.padhint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa3ad;font:500 15px/1.4 var(--f-ui);pointer-events:none;text-align:center}
.stamp{width:96px;height:96px;border-radius:50%;border:3px double var(--seal);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:rotate(-9deg);flex:none}
.stamp b{font:800 24px/1 var(--f-doc)} .stamp small{font:600 11px/1 var(--f-mono)}
.donehead{display:flex;gap:16px;align-items:center}
.donehead h2{font:700 21px/1.35 var(--f-doc)}

.myrow{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:10px;overflow-x:auto}
.myrow table{border-collapse:collapse;width:100%;font-family:var(--f-doc);color:#111;font-size:15px}
.myrow th,.myrow td{border:1px solid #111;padding:6px 5px;text-align:center;white-space:nowrap}
.myrow td.sg{padding:2px;width:40%;min-width:110px}
.myrow td.sg img{display:block;width:100%;height:auto}
/* 서식 미리보기: 794px 종이를 화면 너비에 맞춰 줄인다 */
.pages{display:flex;flex-direction:column;gap:16px;align-items:center}
.pagefit{width:100%;max-width:794px;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow);background:#fff}
.pagefit>.pg{width:794px;transform-origin:0 0}

/* 관리자 */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:11px 14px 10px;font:600 14.5px/1 var(--f-ui);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi b{font:700 28px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi.hot b{color:var(--seal)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t .in{min-height:34px;padding:4px 8px;font-size:14.5px}
.sigthumb{display:block;height:30px;width:110px;background:#fff;border:1px solid var(--line);border-radius:4px;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:var(--sunk);font-size:13px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:9px 14px;font:600 14px/1.2 var(--f-ui);color:var(--muted);background:var(--surface)}
.seg label+label span{border-left:1px solid var(--line2)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.cols{display:flex;flex-direction:column;gap:6px}
.colrow{display:grid;grid-template-columns:minmax(0,1.6fr) 96px 74px auto;gap:6px;align-items:center}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs figure{margin:0;position:relative}
.imgs img{height:90px;width:auto;border-radius:8px;border:1px solid var(--line);display:block}
.imgs button{position:absolute;top:4px;right:4px}
.qr{width:176px;height:176px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.qr.sm{width:156px;height:156px;padding:2px}
.qrbox{display:flex;gap:14px;align-items:center;border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;background:var(--surface)}
.qrbox b{font-size:15px}
.qrbox .hint{margin-top:3px}
@media (max-width:640px){.qrbox{display:none}}
.linkbox{font:500 13px/1.5 var(--f-mono);background:var(--sunk);border-radius:8px;padding:9px 11px;overflow-wrap:anywhere;user-select:all}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.codebox{max-height:220px;overflow:auto;background:var(--sunk);border-radius:8px;padding:10px;font:12px/1.5 var(--f-mono);white-space:pre;user-select:all}

/* PDF 서식: 칸 맞추기 */
.pfed{position:relative;width:100%;border:1px solid var(--line2);background:#fff;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation;line-height:0;box-shadow:var(--shadow)}
.pfed img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.pfb,.pfr,.pfdrag{position:absolute;pointer-events:none;box-sizing:border-box}
.pfb{border:2px solid #C4372B;background:rgba(196,55,43,.16);color:#8A1F16;font:700 11px/1 var(--f-ui);font-style:normal;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.pfb.st{border-color:#1F4E79;background:rgba(31,78,121,.16);color:#1F4E79}
.pfr{border:1px dashed rgba(196,55,43,.6);background:rgba(196,55,43,.05)}
.pfdrag{border:2px dashed #1F4E79;background:rgba(31,78,121,.12)}
.pfrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pfrow .in{width:78px;min-height:32px;padding:4px 6px;font-size:13px}
.pnqr svg{display:block;width:100%;height:100%}
/* PDF 서식: 끌어다 놓기 */
.pfdrop{position:relative}
.pfdrop.drag{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
.pfdrop.drag::after{content:attr(data-drop);position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;border-radius:12px;background:rgba(31,78,121,.88);color:#fff;font:700 18px/1.4 var(--f-ui);pointer-events:none}

/* 백업 한 권(설정·명단·서명)을 지금 PID·TOKEN이 가리키는 서버 서명철에 넣는다. have 에 있는 서명(같은 ID)은 건너뛴다.

  if (src.length) {
    const j = await call('adminSaveRoster', { roster: src.map(r => ({ rid: r.id || r.rid || uid('r'), name: String(r.name).trim(), position: String(r.position || '').trim(), mid: digits(r.mid).slice(-4), last4: digits(r.last4).slice(-4), note: r.note || '' })) }), got = (j.roster || []).slice();
    src.forEach(r => {

      if (i < 0) i = got.findIndex(g => g && g.name === String(r.name).trim() && String(g.last4 || '') === digits(r.last4).slice(-4));
      if (i < 0 || !old) return; ridMap[old] = got[i].rid; l4[got[i].rid] = String(got[i].last4 || ''); got[i] = null;

    catch (e) { out.fail++; out.err = e.message; if (e.code === 'auth') break; }

}

  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

}

function drawQRs() {

/* PDF 서식 끌어다 놓기: 서식 설정의 PDF 상자(#pfdrop)에 파일을 놓으면 올린다.
   상자 밖에 놓은 파일은 브라우저가 그 파일을 열어 화면이 넘어가 버리지 않게 막기만 한다 */
const dragHasFile = e => { const t = e.dataTransfer && e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0; };
const dropZoneOf = e => (e.target && e.target.closest ? e.target.closest('#pfdrop') : null);
let dropT = 0;
const dropMark = on => { const z = $('#pfdrop'); if (z) z.classList.toggle('drag', !!on); clearTimeout(dropT); if (on) dropT = setTimeout(() => dropMark(false), 900); };
document.addEventListener('dragover', e => { if (!dragHasFile(e)) return; e.preventDefault(); const z = dropZoneOf(e); e.dataTransfer.dropEffect = z ? 'copy' : 'none'; dropMark(!!z); });
document.addEventListener('dragleave', e => { if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) dropMark(false); });
document.addEventListener('drop', async e => {
  if (!dragHasFile(e)) return; e.preventDefault(); const z = dropZoneOf(e); dropMark(false); if (!z) return;
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  await pfUpload(f, +val('pf_page') || 1);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset && el.dataset.sel) { readFields(); render(); const x = $('#fx_' + el.dataset.sel); if (x) x.focus(); }
  else if (el.name === 'pk') doLookup(el.value);
  else if (el.name === 'md') { S.cfg.mode = el.value; await saveCfg(el.value === 'roster' ? '명단에 있는 사람만 서명할 수 있게 했습니다.' : '누구나 서명할 수 있게 했습니다.'); render(); }
  else if (el.id === 'md_out') { S.cfg.allowOutside = el.checked; saveCfg(el.checked ? '명단에 없는 사람도 직접 적고 서명할 수 있습니다.' : '명단에 있는 사람만 서명할 수 있습니다.'); }
  else if (el.id === 'nt_img' && el.files && el.files.length) { const fl = Array.from(el.files); el.value = ''; await addMedia(fl); }
  else if (el.id === 'rs_file' && el.files[0]) { busy('명단을 읽는 중…'); try { const L = await readRosterFile(el.files[0]); if (!L.length) toast('파일에서 명단을 찾지 못했습니다. 첫 줄에 성명·직·휴대폰 머리글을 넣어 주세요.'); else { V.rdraft = V.rdraft.concat(L); toast(`${L.length}명을 추가했습니다. [서명 대상 저장]을 눌러야 반영됩니다.`); } } catch (x) { toast(x.message || '파일을 읽지 못했습니다.'); } busy(); render(); }
  else if (el.id === 'bk_all' && el.files && el.files.length) { let n = 0, last = ''; for (const f of Array.from(el.files)) { try { const r = importBackupObj(JSON.parse(await f.text())); n += r.n; last = r.lastId || last; } catch (x) { toast(`${f.name}: ${x.message || '읽지 못했습니다.'}`); } } el.value = ''; if (n) { toast(`서명철 ${n}개를 가져왔습니다.`); if (n === 1 && last) { loadLocal(last); ADMIN = true; V.view = 'admin'; V.tab = 'status'; } } V.rdraft = null; render(); }
  else if (el.id === 'bk_file' && el.files[0]) { try { const o = JSON.parse(await el.files[0].text()); el.value = ''; if (SERVER) { askRestore(o); return; } if (!o || o.app !== 'dsign') throw new Error('이 프로그램의 백업 파일이 아닙니다.'); const pw = S.cfg.pwHash; S.cfg = normCfg(o.cfg); S.cfg.pwHash = pw; S.roster = Array.isArray(o.roster) ? o.roster : []; S.sigs = (Array.isArray(o.sigs) ? o.sigs : []).filter(s => s && s.id && Array.isArray(s.strokes)); sortSigs(); persist('all'); V.rdraft = null; toast(`백업을 불러왔습니다. 서명 ${S.sigs.length}명 · 명단 ${S.roster.length}명`); } catch (x) { toast(x.message || '백업 파일을 읽지 못했습니다.'); } render(); }
  else if (el.id === 'bk_srv' && el.files && el.files.length) {
    const books = []; for (const f of Array.from(el.files)) { try { const o = JSON.parse(await f.text()); if (o && o.app === 'dsign-all' && Array.isArray(o.books)) o.books.forEach(bk => books.push(bk)); else if (o && o.app === 'dsign') books.push(o); else throw new Error('이 프로그램의 백업 파일이 아닙니다.'); } catch (x) { toast(`${f.name}: ${x.message || '읽지 못했습니다.'}`); } }
    el.value = ''; if (books.length) await importToServer(books); }
  else if (el.id === 'pf_file' && el.files[0]) { const f = el.files[0], pno = +val('pf_page') || 1; el.value = ''; await pfUpload(f, pno); }
  else if (el.dataset && el.dataset.ps != null && el.dataset.k === 'auto') {
    readTpl(); const P = S.cfg.tpl.pdf, x = P && P.st[+el.dataset.ps];
    if (x && el.value) { x.t = el.value; if (!x.n.trim()) x.n = (PF_ST.find(a => a[0] === el.value) || [])[1] || ''; } render(); }
  else if (/^pf_(per|dy|blocks|dx)$/.test(el.id || '') || (el.dataset && el.dataset.pc != null)) {
    /* 값을 고치고 곧바로 단추를 누른 경우에는 그 단추가 값을 읽고 화면을 다시 그리므로 여기서는 그리지 않는다 (누름이 사라지지 않게) */
    setTimeout(() => { if (Date.now() - lastDown.t < 500 && lastDown.el && lastDown.el.closest && lastDown.el.closest('[data-act]')) return; if (!$('#pfed')) return; readTpl(); renderKeep(); }, 0); }
  
});
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { const d = e.target.closest && e.target.closest('#nt_drop'); if (!d) return; e.preventDefault(); d.classList.add('over'); }));
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#nt_drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#nt_drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const fl = Array.from((e.dataTransfer && e.dataTransfer.files) || []); if (fl.length) addMedia(fl); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return; const id = e.target.id;
  if (id === 'pw1' || id === 'pw2' || id === 'pwcode') doLogin(); else if (id === 'mid') onAct('midgo'); else if (id === 'lic_code') onAct('licGo'); else if (id === 'op_pid') onAct('openBook'); else if (id === 'mk_key') onAct('mkGo'); else if (id === 'qr_free') onAct('qrFree'); else if (id === 'lk_api3') onAct('goServer3'); else if (id === 'nb_title' || id === 'nb_pw' || id === 'nb_code') onAct('createBook'); else if (id === 'lb_title') onAct('lcreate'); else if (/^bt_/.test(id)) onAct('bRename', { dataset: { id: id.slice(3) } }); else if (/^f_|^fx_/.test(id)) toPad();
});

/* ---------- 시작 ---------- */
async function bootServer() {
  V.view = 'load'; render();
  try { const j = await call('boot'); BOOK = { title: j.title, until: '' }; S = { cfg: normCfg(j.cfg), roster: [], sigs: [], count: j.count || 0, rosterN: j.rosterN || 0 }; ADMIN = false; TOKEN = ''; resetSigner(); V.err = ''; V.view = 'intro'; syncUrl(); }
  catch (e) { V.err = e.message; PID = ''; V.view = 'landing'; }
  render();
}
if (SERVER) { if (PID) bootServer(); else { V.view = 'landing'; render(); } }
else { localBooks(); V.view = 'llanding'; render(); }   /* 처음 화면은 언제나 서명철 고르기 */

})();
</script>
</body>
</html>
